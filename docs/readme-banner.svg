    <text x="18" y="327" fill="#78827e" font-size="8" font-family="Consolas, monospace">STATUS: READY</text>
    <text x="326" y="327" text-anchor="end" fill="#78827e" font-size="8" font-family="Consolas, monospace">CN / 2026</text>
  </g>

  <rect x="1" y="1" width="1198" height="518" rx="17" fill="none" stroke="#fff" stroke-opacity=".08"/>
