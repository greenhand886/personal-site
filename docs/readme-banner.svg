      <ellipse rx="78" ry="42" opacity=".17" transform="rotate(62)"/>
      <circle r="31" fill="#88f7be" fill-opacity=".04" stroke-opacity=".55"/>
      <circle cx="68" cy="-22" r="4" fill="#88f7be" stroke="none"/>
      <circle cx="-42" cy="50" r="3" fill="#88f7be" stroke="none"/>
      <text y="5" text-anchor="middle" fill="#88f7be" stroke="none" font-size="14" font-family="Consolas, monospace">AI</text>
